name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  production-site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:notices
      - run: npm run db:check
      - run: npm run build
      - run: npm run test:bundle
      - run: npm audit --omit=dev
      - if: github.ref == 'refs/heads/main'
        run: npx playwright install --with-deps chromium
      - if: github.ref == 'refs/heads/main'
        run: npm run test:ui:ci
      - if: github.ref == 'refs/heads/main'
        run: npm run test:performance:ci
      - if: github.ref == 'refs/heads/main'
        run: npm run test:backup-spike

  recovery-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: recovery-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: recovery-site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:notices
      - run: npm run db:check
      - run: npm run build
      - run: npm run test:bundle
      - run: npm audit --omit=dev
